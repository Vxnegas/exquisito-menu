<style>
:root {
  --rojo: #B3241A;
  --rojo-oscuro: #8E1C14;
  --rojo-suave: #FBEAE8;
  --tinta: #1E1A18;
  --texto: #3B3532;
  --gris: #77706B;
  --linea: #E7E2DE;
  --fondo: #FFFFFF;
  --calido: #F4F0EB;
  --placeholder: #EFECEA;
  --pie: #1C1917;
  --barra-alto: 112px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: "Archivo", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.contenedor { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.titulo {
  font-family: "Archivo", sans-serif;
  font-stretch: 68%;
  font-weight: 800;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--tinta);
}

/* ---------- Encabezado ---------- */
header.hero { background: var(--rojo); color: #fff; padding: 28px 0 22px; text-align: center; }
.sello {
  width: 76px; height: 76px; margin: 0 auto 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px var(--rojo), 0 0 0 5px rgba(255,255,255,.85);
  display: grid; place-items: center; overflow: hidden;
}
.sello span { font-stretch: 68%; font-weight: 900; font-size: 44px; color: var(--rojo); line-height: 1; }
.sello.con-logo { width: 120px; height: 120px; }
.sello img { width: 100%; height: 100%; object-fit: cover; }
.hero h1 {
  margin: 0; color: #fff;
  font-stretch: 62%; font-weight: 900; font-size: 40px; line-height: .95;
  text-transform: uppercase; letter-spacing: .01em;
}
.hero .eslogan { margin: 8px 0 16px; font-size: 14px; opacity: .92; }
.estado {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(0,0,0,.18);
  font-size: 13px; font-weight: 600;
}
.estado .punto { width: 8px; height: 8px; border-radius: 50%; background: #9BE29B; }
.estado.cerrado .punto { background: #FFB4A8; }
.estado .horas { font-weight: 400; opacity: .9; }

/* ---------- Barra fija ---------- */
.barra {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,.97);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--linea);
}
.buscador { position: relative; padding-top: 10px; }
.buscador svg { position: absolute; left: 12px; top: 50%; margin-top: 5px; transform: translateY(-50%); color: var(--gris); pointer-events: none; }
.buscador input {
  width: 100%; height: 42px;
  padding: 0 38px 0 38px;
  border: 1px solid var(--linea); border-radius: 10px;
  background: #F8F6F4;
  font: inherit; font-size: 16px; color: var(--tinta);
  -webkit-appearance: none; appearance: none;
}
.buscador input:focus { outline: none; border-color: var(--rojo); background: #fff; }
.buscador input::-webkit-search-cancel-button { display: none; }
.limpiar {
  position: absolute; right: 6px; top: 50%; margin-top: 5px; transform: translateY(-50%);
  width: 32px; height: 32px; border: 0; background: none; color: var(--gris);
  display: none; place-items: center; cursor: pointer; border-radius: 50%;
}
.limpiar.visible { display: grid; }
.pestanas {
  display: flex; gap: 22px;
  overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 0 16px;
}
.pestanas::-webkit-scrollbar { display: none; }
.pestanas a {
  flex: none; position: relative;
  padding: 12px 0 11px;
  font-stretch: 75%; font-weight: 700; font-size: 14px;
  text-transform: uppercase; letter-spacing: .03em;
  color: var(--gris); text-decoration: none; white-space: nowrap;
}
.pestanas a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0;
  height: 3px; border-radius: 3px 3px 0 0; background: transparent;
}
.pestanas a.activa { color: var(--tinta); }
.pestanas a.activa::after { background: var(--rojo); }
.pestanas a.oculta { display: none; }

/* ---------- Secciones ---------- */
main { padding-bottom: 8px; }
section.categoria { padding-top: 26px; scroll-margin-top: calc(var(--barra-alto) + 4px); }
.categoria h2 { margin: 0 0 4px; font-size: 26px; line-height: 1; }
.categoria h2::after {
  content: ""; display: block; width: 32px; height: 3px; margin-top: 8px;
  background: var(--rojo); border-radius: 2px;
}
.categoria.destacada .caja {
  background: var(--calido);
  border-radius: 14px;
  padding: 18px 16px 4px;
}
.categoria.destacada h2 { margin-bottom: 2px; }

ul.lista { list-style: none; margin: 0; padding: 0; }
.producto {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid var(--linea);
}
.producto:last-child { border-bottom: 0; }
.destacada .producto { border-bottom-color: #E2DCD5; }
.foto {
  flex: none; width: 84px; height: 84px; border-radius: 10px;
  background: var(--placeholder); overflow: hidden;
  display: grid; place-items: center; color: #B5AEA8;
}
.destacada .foto { width: 104px; height: 104px; background: #E8E2DB; color: #ADA49B; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { flex: 1; min-width: 0; }
.fila { display: flex; align-items: baseline; gap: 10px; }
.nombre {
  flex: 1; min-width: 0; margin: 0;
  font-stretch: 75%; font-weight: 700; font-size: 18px; line-height: 1.15;
  color: var(--tinta);
}
.precio {
  flex: none;
  font-stretch: 75%; font-weight: 800; font-size: 17px;
  color: var(--tinta); font-variant-numeric: tabular-nums;
}
.etiqueta {
  display: inline-block; vertical-align: 2px; margin-left: 6px;
  padding: 2px 7px; border-radius: 4px;
  background: var(--rojo-suave); color: var(--rojo);
  font-stretch: 85%; font-weight: 700; font-size: 10.5px;
  letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.descripcion { margin: 5px 0 0; color: var(--gris); font-size: 14px; }

.sin-resultados { display: none; text-align: center; padding: 48px 8px 24px; color: var(--gris); }
.sin-resultados.visible { display: block; }
.sin-resultados strong { display: block; color: var(--tinta); font-stretch: 75%; font-size: 20px; text-transform: uppercase; margin-bottom: 4px; }

/* ---------- Aviso final ---------- */
.aviso {
  margin: 34px 0 32px;
  padding: 22px 20px;
  border: 1.5px solid var(--rojo); border-radius: 14px;
  text-align: center;
}
.aviso h3 { margin: 0 0 6px; font-size: 22px; color: var(--rojo); }
.aviso p { margin: 0; color: var(--texto); }

/* ---------- Pie ---------- */
footer { background: var(--pie); color: #C9C2BC; padding: 32px 0 calc(28px + env(safe-area-inset-bottom)); font-size: 14px; }
footer .marca { font-stretch: 62%; font-weight: 900; font-size: 26px; color: #fff; text-transform: uppercase; margin: 0 0 18px; }
.datos { display: grid; gap: 16px; margin-bottom: 22px; }
.dato { display: flex; gap: 12px; align-items: flex-start; }
.dato svg { flex: none; margin-top: 2px; color: #E0675D; }
.dato b { display: block; color: #fff; font-weight: 600; font-stretch: 85%; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; margin-bottom: 2px; }
.dato a { color: #C9C2BC; }
.redes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
.redes a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 999px;
  border: 1px solid #3A3431; color: #E9E4E0; text-decoration: none; font-size: 13px;
}
.redes a:active { background: #2A2522; }
.nota { border-top: 1px solid #332E2B; padding-top: 16px; font-size: 12px; color: #8F8780; }
</style>
</head>
<body>

<header class="hero">
  <div class="contenedor">

<main class="contenedor">

<footer>
  <div class="contenedor">
    <p class="marca" id="pieNombre"></p>
    <div class="datos">
      <div class="dato">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div><b>Dirección</b><span id="pieDireccion"></span></div>
      </div>
      <div class="dato">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div><b>Horario</b><span id="pieHorario"></span></div>
      </div>
      <div class="dato">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <div><b>Domicilios</b><a id="pieDomicilios"></a></div>
      </div>

    <div class="redes" id="redes"></div>
    <p class="nota">Precios en pesos colombianos. Sujetos a cambios sin previo aviso.</p>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const ICONO_PLATO =
    '<svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="24" cy="25" r="11"/><circle cx="24" cy="25" r="6.5"/>' +
    '<path d="M7 12v8a3 3 0 0 0 6 0v-8M10 12v26"/>' +
    '<path d="M41 12c-3 0-4.5 4-4.5 9 0 2 1 3 2.5 3H41v14V12z"/></svg>';

  const ICONOS_RED = {
    instagram: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    facebook: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.5-1.3 1.4-1.3H17V2.2C16.6 2.1 15.5 2 14.4 2 11.9 2 10.3 3.5 10.3 6.3v2.2H7.5v3.7h2.8V22H14v-9.8h2.8l.5-3.7H14z"/></svg>',
    tiktok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.6 7.6 0 0 0 4.4 1.4V6.7A4.4 4.4 0 0 1 16.6 2z"/></svg>'
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const precio = (n) => "$" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const normalizar = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const slug = (s) => normalizar(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  /* ---------- Encabezado y pie ---------- */
  document.title = NEGOCIO.nombre + " · Menú";
  $("sello").classList.toggle("con-logo", !!NEGOCIO.logo);
  $("sello").innerHTML = NEGOCIO.logo
    ? '<img src="' + esc(NEGOCIO.logo) + '" alt="' + esc(NEGOCIO.nombre) + '">'
    : "<span>E</span>";
  $("nombre").textContent = NEGOCIO.nombre;
  $("eslogan").textContent = NEGOCIO.eslogan;
  $("pieNombre").textContent = NEGOCIO.nombre;
  $("pieDireccion").textContent = NEGOCIO.direccion;
  $("pieHorario").textContent = NEGOCIO.horarioTexto;
  $("pieDomicilios").textContent = NEGOCIO.domicilios;
  $("pieDomicilios").href = "tel:" + NEGOCIO.domicilios.replace(/[^\d+]/g, "");
  $("redes").innerHTML = NEGOCIO.redes.map((r) =>
    '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + (ICONOS_RED[r.red] || "") + esc(r.usuario) + "</a>"
  ).join("");

  /* ---------- Abierto / cerrado ---------- */
  const aMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const hora12 = (hhmm) => {
    let [h, m] = hhmm.split(":").map(Number);
    const suf = h >= 12 ? "p.m." : "a.m.";
    h = h % 12 || 12;
    return h + ":" + String(m).padStart(2, "0") + " " + suf;
  };
  function ahoraLocal() {
    try {
      const partes = new Intl.DateTimeFormat("en-US", {
        timeZone: NEGOCIO.zonaHoraria, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).formatToParts(new Date());
      const get = (t) => partes.find((p) => p.type === t).value;
      const dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(get("weekday"));
      return { dia, min: Number(get("hour")) * 60 + Number(get("minute")) };
    } catch (e) {
      const d = new Date();
      return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() };
    }
  }
  function actualizarEstado() {
    const { dia, min } = ahoraLocal();
    const hoy = NEGOCIO.horario[dia];
    const ayer = NEGOCIO.horario[(dia + 6) % 7];
    let abierto = false, cierre = null;

    if (hoy) {
      const a = aMin(hoy[0]), c = aMin(hoy[1]);
      if (c > a ? (min >= a && min < c) : min >= a) { abierto = true; cierre = hoy[1]; }
    }
    if (!abierto && ayer) {
      const a = aMin(ayer[0]), c = aMin(ayer[1]);
      if (c <= a && min < c) { abierto = true; cierre = ayer[1]; }
    }

    const el = $("estado");
    el.classList.toggle("cerrado", !abierto);
    $("estadoTexto").textContent = abierto ? "Abierto ahora" : "Cerrado ahora";
    let horas = "";
    if (abierto) horas = "· Cierra a las " + hora12(cierre);
    else if (hoy && min < aMin(hoy[0])) horas = "· Abre hoy a las " + hora12(hoy[0]);
    else horas = "· " + NEGOCIO.horarioTexto;
    $("estadoHoras").textContent = horas;
  }
  actualizarEstado();
  setInterval(actualizarEstado, 60000);

  /* ---------- Menú ---------- */
  const secciones = MENU.map((cat) => ({ ...cat, id: slug(cat.categoria) }));

  function htmlProducto(p) {
    const foto = p.foto
      ? '<img src="' + esc(p.foto) + '" alt="' + esc(p.nombre) + '" loading="lazy" onerror="this.parentNode.innerHTML=window.__ICONO_PLATO">'
      : ICONO_PLATO;
    const etiqueta = p.etiqueta ? '<span class="etiqueta">' + esc(p.etiqueta) + "</span>" : "";
    const texto = normalizar([p.nombre, p.descripcion, p.etiqueta].join(" "));
    return (
      '<li class="producto" data-texto="' + esc(texto) + '">' +
        '<div class="foto">' + foto + "</div>" +
        '<div class="info">' +
          '<div class="fila"><h3 class="nombre">' + esc(p.nombre) + etiqueta + "</h3>" +
          '<span class="precio">' + precio(p.precio) + "</span></div>" +
          (p.descripcion ? '<p class="descripcion">' + esc(p.descripcion) + "</p>" : "") +
        "</div>" +
      "</li>"
    );
  }
  window.__ICONO_PLATO = ICONO_PLATO;

  $("menu").innerHTML = secciones.map((cat) => {
    const contenido = '<h2 class="titulo">' + esc(cat.categoria) + "</h2>" +
      '<ul class="lista">' + cat.productos.map(htmlProducto).join("") + "</ul>";
    return '<section class="categoria' + (cat.destacada ? " destacada" : "") + '" id="' + cat.id + '">' +
      (cat.destacada ? '<div class="caja">' + contenido + "</div>" : contenido) +
      "</section>";
  }).join("");

  $("pestanas").innerHTML = secciones.map((cat) =>
    '<a href="#' + cat.id + '" data-id="' + cat.id + '">' + esc(cat.categoria) + "</a>"
  ).join("");

  /* ---------- Pestañas que se marcan solas ---------- */
  const barra = $("barra");
  const pestanas = $("pestanas");
  const enlaces = Array.from(pestanas.querySelectorAll("a"));
  const sections = Array.from(document.querySelectorAll("section.categoria"));
  let bloqueo = 0;

  function medirBarra() {
    document.documentElement.style.setProperty("--barra-alto", barra.offsetHeight + "px");
  }
  medirBarra();
  window.addEventListener("resize", medirBarra);

  function marcar(id) {
    enlaces.forEach((a) => {
      const activa = a.dataset.id === id;
      if (activa && !a.classList.contains("activa")) {
        const izq = a.offsetLeft - (pestanas.clientWidth - a.offsetWidth) / 2;
        pestanas.scrollTo({ left: izq, behavior: "smooth" });
      }
      a.classList.toggle("activa", activa);
    });
  }

  function alDesplazar() {
    if (Date.now() < bloqueo) return;
    const limite = barra.offsetHeight + 24;
    let actual = null;
    for (const s of sections) {
      if (s.style.display === "none") continue;
      if (!actual) actual = s.id;
      if (s.getBoundingClientRect().top <= limite) actual = s.id;
    }
    const fin = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
    if (fin) {
      const visibles = sections.filter((s) => s.style.display !== "none");
      if (visibles.length) actual = visibles[visibles.length - 1].id;
    }
    if (actual) marcar(actual);
  }
  let pendiente = false;
  window.addEventListener("scroll", () => {
    if (pendiente) return;
    pendiente = true;
    requestAnimationFrame(() => { pendiente = false; alDesplazar(); });
  }, { passive: true });

  pestanas.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    const destino = $(a.dataset.id);
    marcar(a.dataset.id);
    bloqueo = Date.now() + 700;
    const y = destino.getBoundingClientRect().top + window.scrollY - barra.offsetHeight + 1;
    window.scrollTo({ top: y, behavior: "smooth" });
  });

  /* ---------- Buscador (ignora tildes) ---------- */
  const input = $("buscar");
  const limpiar = $("limpiar");

  function filtrar() {
    const q = normalizar(input.value);
    const palabras = q.split(/\s+/).filter(Boolean);
    let total = 0;
    sections.forEach((s) => {
      const nombreCat = normalizar(s.querySelector("h2").textContent);
      let visibles = 0;
      s.querySelectorAll(".producto").forEach((li) => {
        const texto = li.dataset.texto + " " + nombreCat;
        const ok = palabras.every((w) => texto.includes(w));
        li.style.display = ok ? "" : "none";
        if (ok) visibles++;
      });
      s.style.display = visibles ? "" : "none";
      enlaces.find((a) => a.dataset.id === s.id).classList.toggle("oculta", !visibles);
      total += visibles;
    });
    $("sinResultados").classList.toggle("visible", total === 0);
    limpiar.classList.toggle("visible", q.length > 0);
    alDesplazar();
  }

  input.addEventListener("input", () => {
    filtrar();
    const menuTop = $("menu").getBoundingClientRect().top + window.scrollY - barra.offsetHeight;
    if (window.scrollY > menuTop) window.scrollTo({ top: menuTop });
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  limpiar.addEventListener("click", () => { input.value = ""; filtrar(); input.focus(); });

  alDesplazar();
})();
</script>
</body>
</html>
